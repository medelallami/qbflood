name: publish-docker

on:
  push:
    branches:
      - beta
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: '11.5.2'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package tarball
        run: |
          pnpm run build
          npm pack
          # Rename to flood.tgz for predictable COPY in Dockerfile.release
          mv flood-*.tgz flood.tgz
          ls -la flood.tgz

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./distribution/containers/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/qbflood:beta
            ghcr.io/${{ github.repository_owner }}/qbflood:latest
          build-args: |
            PACKAGE_TARBALL=flood.tgz
            FLOOD_VERSION=beta-${{ github.sha }}
